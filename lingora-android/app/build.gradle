plugins {
    id 'com.android.application'
}

Properties localProperties = new Properties()
File localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

String supabaseUrl = localProperties.getProperty('SUPABASE_URL', 'https://oazmbpifslcpolkepyge.supabase.co')
String supabaseAnonKey = localProperties.getProperty('SUPABASE_ANON_KEY', 'sb_publishable_QrM3whFUdoVmhWpX9oTpnA_Rbda6pMZ')
String aiApiBaseUrl = localProperties.getProperty('AI_API_BASE_URL', 'http://10.0.2.2:8000/')

android {
    namespace 'com.pnttung.lingora'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pnttung.lingora'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'SUPABASE_URL', "\"${supabaseUrl}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${supabaseAnonKey}\""
        buildConfigField 'String', 'AI_API_BASE_URL', "\"${aiApiBaseUrl}\""
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX & Material
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Architecture Components (Lifecycle, ViewModel, LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'

    // Network & Serialization (Retrofit, OkHttp, Gson)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Secure Storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room Database boundary (annotation processor only, no speculative entity in M1.6)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
