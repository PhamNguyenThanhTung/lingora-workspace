# Lingora Task-Local Disposable Supabase Configuration
# Controlled by Lingora WP-00 and used for P0/P1 feasibility testing.
# Feasible via experimental native stack (SUPABASE_EXPERIMENTAL_STACK=1, --runtime native)

project_id = "lingora-local-dev"

[experimental]
stack = true

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17
orioledb_version = ""

[db.pooler]
enabled = false
port = 54329
pool_mode = "session"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false
allowed_cidrs = ["127.0.0.1/32"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback"
]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enabled = false

[auth.mfa]
max_enrolled_factors = 10

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[studio]
enabled = true
port = 54323

[realtime]
enabled = true
port = 54328

[analytics]
enabled = false
